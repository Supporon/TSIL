
qlib_init:
    provider_uri: "./qlib_data/cn_data"
    region: cn

market: &market csi800
benchmark: &benchmark SH000906
logdir: &logdir output_f158_csi800/stockmixer

# StockMixer core parameters
seq_len: &seq_len 20              # lookback_length: number of lookback time steps

model_config: &model_config
  # phi_type drives the loss (no loss_type field): mse=plain MSE | ones=Φ_ones control | <temporal>=TSIL
  phi_type: mse
  
  # sequence-related parameters
  seq_len: *seq_len               # lookback_length: number of lookback time steps
  pred_len: 1                     # steps: number of future steps to predict
  
  # model architecture parameters
  e_layers: 2                     # kept for compatibility
  factor: 3                       # kept for compatibility
  enc_in: 158                       # fea_num: number of features per time step
  c_out: 1                        # steps: output dimension
  d_model: 64                     # kept for compatibility
  d_ff: 16                        # kept for compatibility
  n_heads: 2                      # kept for compatibility
  
  # StockMixer-specific parameters
  market_num: 20                  # market_num: market-dimension hidden size
  scale_factor: 3                 # scale_factor: number of scales in the multi-scale temporal mixer
  activation: 'GELU'              # activation function type
  rank_loss_alpha: 0.1            # alpha: rank-loss weight
  
  # generic parameters
  dropout: 0.1
  use_attn: False
  noise_level: 0.0
  tau_hat_init: 0.0
  plot_show: False

# dataset index configuration
# valid_index: 756              # validation start index
# test_index: 1008              # test start index

data_handler_config: &data_handler_config
    start_time: 2018-01-01
    end_time: 2025-08-31
    fit_start_time: 2018-01-01
    fit_end_time: 2022-12-31
    instruments: *market
    infer_processors:
        - class: RobustZScoreNorm
          kwargs:
              fields_group: feature
              clip_outlier: true
        - class: Fillna
          kwargs:
              fields_group: feature
    learn_processors:
        - class: DropnaLabel
        - class: CSRankNorm
          kwargs:
              fields_group: label
    label: ["Ref($close, -2) / Ref($close, -1) - 1"]

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
    backtest:
        start_time: 2024-01-01
        end_time: 2025-08-31
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5

task:
    model:
      class: QniverseModel
      module_path: src/model_backbone_phitp.py
      kwargs:
        lr: 0.001
        n_epochs: 50
        max_steps_per_epoch: 5000
        early_stop: 10
        seed: 2025
        logdir: *logdir
        model_type: StockMixer
        model_config: *model_config
        freeze_model: False
    dataset:
      class: MTSDatasetH
      module_path: src/dataset_ori_onehot.py
      kwargs:
        handler:
          class: Alpha158          # Alpha158 feature handler
          module_path: qlib.contrib.data.handler
          kwargs: *data_handler_config
        segments:
          train: [ 2018-01-01, 2022-12-31 ]
          valid: [ 2023-01-01, 2023-12-31 ]
          test: [ 2024-01-01, 2025-08-31 ]
        seq_len: *seq_len
        horizon: 1
        batch_size: 800           # used together with stock_num
        shuffle: True             # shuffle the training data
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config

strategy_config: &strategy_config
  topk: 50
  hold_thre: 5
  commission_rate: 0.001
