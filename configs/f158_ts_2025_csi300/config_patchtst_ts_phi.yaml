qlib_init:
  provider_uri: "./qlib_data/cn_data"
  region: cn


market: &market csi300
benchmark: &benchmark SH000300
seq_len: &seq_len 20
logdir: &logdir output_f158_1202_2025_phi/patchtst_f158_mse_ep10_best

# loss_type:RankMSELoss、MSE_with_weak、MSELoss

model_config: &model_config
  loss_type: MSE_with_weak
  seq_len: *seq_len
  phi_type: mse
  pred_len: 1
  e_layers: 1
  factor: 3
  enc_in: 158
  patch_len: 5
  stride: 5
  c_out: 1
  d_model: 64
  d_ff: 64
  n_heads: 2
  dropout: 0.1
  activation: 'gelu'
  tau_hat_init: 0.0



data_handler_config: &data_handler_config
  start_time: 2018-01-01
  end_time: 2025-08-31
  fit_start_time: 2018-01-01
  fit_end_time: 2022-12-31
  instruments: *market
  infer_processors:
#    - class: FilterCol
#      kwargs:
#        fields_group: feature
#        col_list: [ "RESI5", "WVMA5", "RSQR5", "KLEN", "RSQR10", "CORR5", "CORD5", "CORR10",
#                    "ROC60", "RESI10", "VSTD5", "RSQR60", "CORR60", "WVMA60", "STD5",
#                    "RSQR20", "CORD60", "CORD10", "CORR20", "KLOW"
#        ]
    - class: RobustZScoreNorm
      kwargs:
        fields_group: feature
        clip_outlier: true
    - class: Fillna
      kwargs:
        fields_group: feature
  learn_processors:
    - class: DropnaLabel
    - class: CSRankNorm
      kwargs:
        fields_group: label
  label: ["Ref($close, -2)/Ref($open, -1) - 1"]  # 方案1,如果策略在开盘时交易 → 使用方案1（今日开盘价）
  # 或: label: ["Ref($close, -2)/$close - 1"]    # 方案2,如果策略在收盘时交易 → 使用方案2（今日收盘价）


port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
    backtest:
        start_time: 2024-01-01
        end_time: 2025-08-31
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5

task:
  model:
    class: QniverseModel
    module_path: src/model_backbone_phix.py
    kwargs:
      lr: 0.0001
      n_epochs: 200
      max_steps_per_epoch: 5000
      early_stop: 10
      seed: 2025
      logdir: *logdir
      model_type: PatchTST
      model_config: *model_config
      freeze_model: False
      model_init_state:
  dataset:
    class: MTSDatasetH
    module_path: src/dataset_ori_onehot.py
    kwargs:
      handler:
        class: Alpha158  # 使用Alpha158特征处理器
        module_path: qlib.contrib.data.handler
        kwargs: *data_handler_config
      segments:
        train: [ 2018-01-01, 2022-12-31 ] # [ 2008-01-01, 2020-03-31 ]
        valid: [ 2023-01-01, 2023-12-31 ] # [ 2020-04-01, 2020-06-30 ]
        test: [ 2024-01-01, 2025-08-31 ] # [ 2020-07-01, 2022-12-31 ]
      seq_len: *seq_len
      horizon: 1
      batch_size: 512
      shuffle: True
#      pin_memory: True     # 加速GPU数据传输
#      drop_last: False
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config

strategy_config: &strategy_config
  topk: 50
  hold_thre: 5
  commission_rate: 0.001


