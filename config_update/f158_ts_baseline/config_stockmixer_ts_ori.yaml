
qlib_init:
    provider_uri: "./qlib_data/cn_data"
    region: cn

market: &market csi300
benchmark: &benchmark SH000300
logdir: &logdir baseline_output_f158_ori/stockmixer_f158_mse_ep10

# StockMixer 核心参数
seq_len: &seq_len 20              # lookback_length: 回看时间步长

model_config: &model_config
  loss_type: MSELoss              # 损失函数类型: Rank、MSELoss、MSE_with_weak
  phi_type: mse
  
  # 序列相关参数
  seq_len: *seq_len               # lookback_length: 回看时间步长
  pred_len: 1                     # steps: 预测未来多少步
  
  # 模型结构参数
  e_layers: 2                     # 保留兼容性
  factor: 3                       # 保留兼容性
  enc_in: 158                       # fea_num: 每个时间步的特征数量
  c_out: 1                        # steps: 输出维度
  d_model: 64                     # 保留兼容性
  d_ff: 16                        # 保留兼容性
  n_heads: 2                      # 保留兼容性
  
  # StockMixer 特有参数
  market_num: 20                  # market_num: 市场维度隐藏层大小
  scale_factor: 3                 # scale_factor: 多尺度时间混合器的缩放因子数量
  activation: 'GELU'              # 激活函数类型
  rank_loss_alpha: 0.1            # alpha: 排序损失权重
  
  # 通用参数
  dropout: 0.1
  use_attn: False
  noise_level: 0.0
  tau_hat_init: 0.0
  plot_show: False

# 数据集索引配置
# valid_index: 756              # 验证集起始索引
# test_index: 1008              # 测试集起始索引

data_handler_config: &data_handler_config
    start_time: 2018-01-01
    end_time: 2025-08-31
    fit_start_time: 2018-01-01
    fit_end_time: 2022-12-31
    instruments: *market
    infer_processors:
        - class: RobustZScoreNorm
          kwargs:
              fields_group: feature
              clip_outlier: true
        - class: Fillna
          kwargs:
              fields_group: feature
    learn_processors:
        - class: DropnaLabel
        - class: CSRankNorm
          kwargs:
              fields_group: label
    label: ["Ref($close, -2) / Ref($close, -1) - 1"]

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
    backtest:
        start_time: 2024-01-01
        end_time: 2025-08-31
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5

task:
    model:
      class: QniverseModel
      module_path: src/model_backbone_phix.py
      kwargs:
        lr: 0.001
        n_epochs: 50
        max_steps_per_epoch: 5000
        early_stop: 10
        seed: 2025
        logdir: *logdir
        model_type: StockMixer
        model_config: *model_config
        freeze_model: False
    dataset:
      class: MTSDatasetH
      module_path: src/dataset_ori_onehot.py
      kwargs:
        handler:
          class: Alpha158          # 使用Alpha158特征处理器
          module_path: qlib.contrib.data.handler
          kwargs: *data_handler_config
        segments:
          train: [ 2018-01-01, 2022-12-31 ]
          valid: [ 2023-01-01, 2023-12-31 ]
          test: [ 2024-01-01, 2025-08-31 ]
        seq_len: *seq_len
        horizon: 1
        batch_size: 800           # 与stock_num配合使用
        shuffle: True             # 训练时打乱数据
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config

strategy_config: &strategy_config
  topk: 50
  hold_thre: 5
  commission_rate: 0.001
